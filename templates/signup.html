<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SkillForge AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #050510;
            --card: #0d0d1f;
            --border: rgba(99,102,241,0.2);
            --primary: #6366f1;
            --text: #f1f5f9;
            --muted: #94a3b8;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .bg-grid {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .bg-glow {
            position: fixed;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 70%);
            top: 50%; right: -100px;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .signup-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand a {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .brand p { color: var(--muted); margin-top: 0.4rem; font-size: 0.95rem; }

        .signup-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: fadeUp 0.5s ease both;
        }

        .signup-card h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.4rem;
        }

        .signup-card .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 2rem; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group { margin-bottom: 1.2rem; }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(99,102,241,0.08);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }

        .btn-signup {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
            box-shadow: 0 0 20px rgba(99,102,241,0.3);
        }

        .btn-signup:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(99,102,241,0.5); }

        .divider {
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
            margin: 1.5rem 0;
            position: relative;
        }

        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%; width: 40%;
            height: 1px;
            background: var(--border);
        }
        .divider::before { left: 0; }
        .divider::after  { right: 0; }

        .footer-links { text-align: center; font-size: 0.95rem; color: var(--muted); }
        .footer-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .footer-links a:hover { text-decoration: underline; }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .back-home:hover { color: var(--text); }

        .message {
            padding: 0.9rem 1rem;
            border-radius: 10px;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }
        .message.success { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
        .message.error   { background: rgba(239,68,68,0.15);  color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="signup-wrapper">
        <div class="brand">
            <a href="{{ url_for('index') }}">⚡ SkillForge AI</a>
            <p>Start your journey to your dream tech job</p>
        </div>

        <div class="signup-card">
            <h2>Create Account ✨</h2>
            <p class="sub">Join for free and start preparing today</p>

            <form id="signupForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="john_dev" required minlength="3" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="john@email.com" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-signup">Create Free Account →</button>
            </form>

            <div id="message"></div>

            <div class="divider">or</div>

            <div class="footer-links">
                Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
            </div>
        </div>

        <a href="{{ url_for('index') }}" class="back-home">← Back to Home</a>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username         = document.getElementById('username').value;
            const email            = document.getElementById('email').value;
            const password         = document.getElementById('password').value;
            const confirmPassword  = document.getElementById('confirmPassword').value;
            const msg              = document.getElementById('message');

            if (password !== confirmPassword) {
                msg.className = 'message error';
                msg.textContent = '✗ Passwords do not match!';
                return;
            }

            try {
                const res  = await fetch('/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();

                if (data.success) {
                    msg.className = 'message success';
                    msg.textContent = '✓ Account created! Redirecting to login...';
                    setTimeout(() => window.location.href = '/login', 1200);
                } else {
                    msg.className = 'message error';
                    msg.textContent = '✗ ' + data.message;
                }
            } catch (err) {
                msg.className = 'message error';
                msg.textContent = '✗ Something went wrong. Please try again.';
            }
        });
    </script>
</body>
</html>
